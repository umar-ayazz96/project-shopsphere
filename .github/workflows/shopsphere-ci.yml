name: shopsphere-ci

on:
  push:
    branches:
      - main
  paths:
      - 'frontend/**'
      - 'backend/**'

jobs:
  frontend:
    name: frontend build
    runs-on: ubuntu-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v3

    - name: log in to docker hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_NAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}  

    - name: build and push frontend docker image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: |
            ${{ secrets.DOCKERHUB_NAME }}/shopsphere-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_NAME }}/shopsphere-frontend:latest

  backend:
    name: backend build
    runs-on: ubuntu-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v3

    - name: log in to docker hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_NAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}  

    - name: build and push backend docker image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: |
            ${{ secrets.DOCKERHUB_NAME }}/shopsphere-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_NAME }}/shopsphere-backend:latest