apiVersion: batch/v1
kind: Job
metadata:
  name: shopsphere-db-migrate
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: umarayaz96/shopsphere-backend:1.3
          command: ["node", "src/config/migrate.js"]
          env:
            - name: SEED_DB
              value: "true"   # set to "false" in production once seeded
          envFrom:
            - configMapRef:
                name: backend-configmap
            - secretRef:
                name: backend-secret