apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    type: frontend
    stage: production
spec:
  replicas: 10
  selector:
    matchLabels:
      type: frontend
  template:
    metadata:
      labels:
        type: frontend
    spec:
      containers:
      - name: shopsphere-frontend
        image: umarayaz96/shopsphere-frontend:1.0
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"